    <path d="M0-67 47-38 59 15 26 58-26 58-59 15-47-38Z" stroke="url(#triad-metal)" stroke-width="5.5" stroke-linejoin="round" filter="url(#triad-glow)"/>
    <path d="M0-60 42-34 52 13 23 51-23 51-52 13-42-34Z" stroke="#FFE4E6" stroke-width="1.1" opacity=".9"/>

