<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <title>Khoa TH Top 3 — Ternary Data Stack</title>
  <defs>
    <linearGradient id="th3-metal" x1="36" y1="24" x2="198" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9E2EC"/><stop offset=".3" stop-color="#738294"/><stop offset=".57" stop-color="#172331"/><stop offset=".82" stop-color="#AEBAC8"/><stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="th3-live" x1="60" y1="48" x2="176" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCE8A"/><stop offset=".38" stop-color="#FF9F43"/><stop offset=".7" stop-color="#8B74FF"/><stop offset="1" stop-color="#6D5DFB"/>
    </linearGradient>
    <filter id="th3-glow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Industrial segmented chassis. -->
  <g stroke-linejoin="bevel">
    <path d="M78 58 L96 47 H144 L162 58" stroke="#101923" stroke-width="11"/>
    <path d="M78 58 L96 47 H144 L162 58" stroke="url(#th3-metal)" stroke-width="6"/>
    <path d="M69 65 L53 83 L48 110" stroke="#101923" stroke-width="11"/>
    <path d="M69 65 L53 83 L48 110" stroke="url(#th3-metal)" stroke-width="6"/>
    <path d="M48 132 L54 157 L72 177" stroke="#101923" stroke-width="11"/>
    <path d="M48 132 L54 157 L72 177" stroke="url(#th3-metal)" stroke-width="6"/>
    <path d="M168 177 L186 157 L192 132" stroke="#101923" stroke-width="11"/>
    <path d="M168 177 L186 157 L192 132" stroke="url(#th3-metal)" stroke-width="6"/>
    <path d="M192 110 L187 83 L171 65" stroke="#101923" stroke-width="11"/>
    <path d="M192 110 L187 83 L171 65" stroke="url(#th3-metal)" stroke-width="6"/>
  </g>

  <!-- Three independently morphing data pylons. -->
  <g filter="url(#th3-glow)" stroke-linejoin="bevel">
    <path fill="url(#th3-metal)" stroke="#FF9F43" stroke-width="1.5" d="M91 51 L96 20 L108 10 L116 18 L112 49 L103 58 Z">
      <animate attributeName="d" values="M91 51 L96 20 L108 10 L116 18 L112 49 L103 58 Z;M89 51 L92 15 L108 5 L118 16 L112 49 L103 58 Z;M91 51 L96 20 L108 10 L116 18 L112 49 L103 58 Z" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#th3-live)" stroke="#D9E2EC" stroke-width="1.5" d="M111 48 L114 14 L123 4 L132 16 L129 48 L121 55 Z">
      <animate attributeName="d" values="M111 48 L114 14 L123 4 L132 16 L129 48 L121 55 Z;M111 48 L113 8 L123 0 L134 13 L129 48 L121 55 Z;M111 48 L114 14 L123 4 L132 16 L129 48 L121 55 Z" dur="4.8s" begin=".22s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#th3-metal)" stroke="#6D5DFB" stroke-width="1.5" d="M131 49 L134 20 L144 12 L154 23 L150 54 L140 59 Z">
      <animate attributeName="d" values="M131 49 L134 20 L144 12 L154 23 L150 54 L140 59 Z;M131 49 L136 15 L147 7 L157 21 L150 54 L140 59 Z;M131 49 L134 20 L144 12 L154 23 L150 54 L140 59 Z" dur="4.8s" begin=".44s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Shoulder controllers. -->
  <g filter="url(#th3-glow)">
    <path d="M14 93 L37 72 L51 77 L42 103 L29 113 L8 108 Z" fill="#101923" stroke="#FF9F43" stroke-width="1.6"/>
    <path d="M8 132 L29 127 L42 137 L51 163 L37 168 L14 147 Z" fill="url(#th3-metal)" stroke="#6D5DFB" stroke-width="1.6"/>
    <path d="M226 93 L203 72 L189 77 L198 103 L211 113 L232 108 Z" fill="url(#th3-metal)" stroke="#6D5DFB" stroke-width="1.6"/>
    <path d="M232 132 L211 127 L198 137 L189 163 L203 168 L226 147 Z" fill="#101923" stroke="#FF9F43" stroke-width="1.6"/>
  </g>
  <g fill="#FF9F43">
    <rect x="17" y="91" width="22" height="3" rx="1"/><rect x="17" y="100" width="14" height="3" rx="1"/>
    <rect x="201" y="137" width="22" height="3" rx="1"/><rect x="209" y="146" width="14" height="3" rx="1"/>
  </g>

  <!-- Bottom status dock 01 / 02 / 03. -->
  <g filter="url(#th3-glow)">
    <path d="M68 176 L91 187 H149 L172 176 L162 205 L145 219 H95 L78 205 Z" fill="#101923" stroke="url(#th3-live)" stroke-width="2"/>
    <path d="M86 191 H154 L147 210 H93 Z" fill="url(#th3-metal)" stroke="#AEBAC8"/>
    <rect x="94" y="196" width="14" height="8" rx="1" fill="#FF9F43"><animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.18;.36;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="113" y="196" width="14" height="8" rx="1" fill="#D9E2EC"><animate attributeName="opacity" values=".25;.25;1;.25" keyTimes="0;.28;.5;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="132" y="196" width="14" height="8" rx="1" fill="#6D5DFB"><animate attributeName="opacity" values=".25;.25;.25;1;.25" keyTimes="0;.38;.56;.74;1" dur="3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Three direct signal paths, never orbiting. -->
  <g stroke-linecap="round" stroke-width="2" filter="url(#th3-glow)">
    <path d="M103 57 L78 74 L67 94" stroke="#FF9F43" stroke-dasharray="54" stroke-dashoffset="54"><animate attributeName="stroke-dashoffset" values="54;0;0;54" keyTimes="0;.2;.75;1" dur="4s" repeatCount="indefinite"/></path>
    <path d="M122 56 V70" stroke="#D9E2EC" stroke-dasharray="14" stroke-dashoffset="14"><animate attributeName="stroke-dashoffset" values="14;0;0;14" keyTimes="0;.2;.75;1" dur="4s" begin=".18s" repeatCount="indefinite"/></path>
    <path d="M141 58 L166 75 L176 95" stroke="#6D5DFB" stroke-dasharray="54" stroke-dashoffset="54"><animate attributeName="stroke-dashoffset" values="54;0;0;54" keyTimes="0;.2;.75;1" dur="4s" begin=".36s" repeatCount="indefinite"/></path>
    <path d="M67 146 L82 175 L101 189" stroke="#FF9F43" stroke-dasharray="62" stroke-dashoffset="62"><animate attributeName="stroke-dashoffset" values="62;0;0;62" keyTimes="0;.25;.8;1" dur="4s" begin=".54s" repeatCount="indefinite"/></path>
    <path d="M176 146 L159 175 L141 189" stroke="#6D5DFB" stroke-dasharray="62" stroke-dashoffset="62"><animate attributeName="stroke-dashoffset" values="62;0;0;62" keyTimes="0;.25;.8;1" dur="4s" begin=".72s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#D9E2EC"><circle cx="48" cy="121" r="2.5"/><circle cx="192" cy="121" r="2.5"/><circle cx="120" cy="46" r="2.5"/></g>
