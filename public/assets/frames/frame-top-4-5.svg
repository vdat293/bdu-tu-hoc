<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Mecha Cyber Titanium & Emerald Neon -->
    <linearGradient id="mc-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="25%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="90%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="mc-cyber-plate" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <radialGradient id="mc-neon-core" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#6ee7b7"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <radialGradient id="mc-radar-halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="mc-mecha-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <mask id="avatar-hole-mc-mecha">
      <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>
      <circle cx="120" cy="120" r="45" fill="#000000"/>
    </mask>
  </defs>

  <!-- MASTER CONTAINER: Centered with 20px padding from all edges to avoid any square clipping -->
  <g transform="translate(120, 120) scale(0.85) translate(-120, -114)">
    <!-- 1. CYBER RADAR TARGETING SCANNER (HEXAGONAL) -->
    <g mask="url(#avatar-hole-mc-mecha)">
      <circle cx="120" cy="120" r="74" fill="url(#mc-radar-halo)"/>
      <g transform="translate(120, 120)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
        <!-- Concentric Hexagon Circuit Lines -->
        <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" stroke="#34d399" stroke-width="1.8" stroke-dasharray="10 8 4 8" fill="none" opacity="0.7"/>
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
        <line x1="-60.6" y1="0" x2="60.6" y2="0" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>
        <!-- Data Nodes on corners -->
        <circle cx="0" cy="-70" r="3" fill="#6ee7b7"/>
        <circle cx="60.6" cy="-35" r="3" fill="#6ee7b7"/>
        <circle cx="60.6" cy="35" r="3" fill="#6ee7b7"/>
        <circle cx="0" cy="70" r="3" fill="#6ee7b7"/>
        <circle cx="-60.6" cy="35" r="3" fill="#6ee7b7"/>
        <circle cx="-60.6" cy="-35" r="3" fill="#6ee7b7"/>
      </g>
    </g>

    <!-- 2. HEAVY ROBOTIC MECHA PAULDRONS & LASER ENERGY BLADES -->
    <g filter="url(#mc-mecha-glow)">
      <!-- Left Cyber Pauldron (Angular Armor & Dual Laser Blades) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 120 120; -1.8 120 120; 0 120 120" dur="3s" repeatCount="indefinite" ease="ease-in-out"/>
        <!-- Main Laser Energy Blade (Chiseled Cyber Blade) -->
        <polygon points="70,110 52,80 20,44 14,36 28,48 48,74 64,102" fill="url(#mc-titanium)"/>
        <polygon points="14,36 20,44 40,30 26,24" fill="#6ee7b7"/>
        <!-- Upper Secondary Pauldron Plate -->
        <polygon points="68,90 44,56 56,48 78,76" fill="url(#mc-cyber-plate)" stroke="#10b981" stroke-width="1.2"/>
        <!-- Laser Edge Light -->
        <line x1="14" y1="36" x2="60" y2="94" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <!-- Exhaust Vents (3 neon slots) -->
        <line x1="50" y1="62" x2="60" y2="56" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="56" y1="72" x2="66" y2="66" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="62" y1="82" x2="72" y2="76" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Lower Armor Plate -->
        <polygon points="66,128 36,114 42,102 68,114" fill="url(#mc-titanium)"/>
      </g>

      <!-- Right Cyber Pauldron (Angular Armor & Dual Laser Blades) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 120 120; 1.8 120 120; 0 120 120" dur="3s" repeatCount="indefinite" ease="ease-in-out"/>
        <!-- Main Laser Energy Blade (Chiseled Cyber Blade) -->
        <polygon points="170,110 188,80 220,44 226,36 212,48 192,74 176,102" fill="url(#mc-titanium)"/>
        <polygon points="226,36 220,44 200,30 214,24" fill="#6ee7b7"/>
        <!-- Upper Secondary Pauldron Plate -->
        <polygon points="172,90 196,56 184,48 162,76" fill="url(#mc-cyber-plate)" stroke="#10b981" stroke-width="1.2"/>
        <!-- Laser Edge Light -->
        <line x1="226" y1="36" x2="180" y2="94" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <!-- Exhaust Vents (3 neon slots) -->
        <line x1="190" y1="62" x2="180" y2="56" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="184" y1="72" x2="174" y2="66" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="178" y1="82" x2="168" y2="76" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Lower Armor Plate -->
        <polygon points="174,128 204,114 198,102 172,114" fill="url(#mc-titanium)"/>
      </g>
    </g>

    <!-- 3. OCTAGONAL MECHA BEZEL & TITANIUM BOLTS -->
    <g filter="url(#mc-mecha-glow)">
      <circle cx="120" cy="120" r="56" stroke="url(#mc-titanium)" stroke-width="6"/>
      <circle cx="120" cy="120" r="51.5" stroke="url(#mc-cyber-plate)" stroke-width="2.2"/>
      <!-- Neon Cyber Circuit Ring -->
      <circle cx="120" cy="120" r="59.5" stroke="#34d399" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 4. CYBER POWER CABLES & THRUSTER BASE (COMPACT & SLEEK) -->
    <g filter="url(#mc-mecha-glow)">
      <polygon points="98,177 120,185 142,177 120,181" fill="url(#mc-titanium)" stroke="#022c22" stroke-width="0.8"/>
      <circle cx="120" cy="181" r="3" fill="url(#mc-neon-core)" stroke="#ffffff" stroke-width="0.8"/>
    </g>

    <!-- 5. TOP APEX: SCI-FI HUD VISOR & TARGETING CROSSHAIR -->
    <g filter="url(#mc-mecha-glow)">
      <!-- Robotic Angular Helmet Crest -->
      <polygon points="120,10 144,32 136,54 104,54 96,32" fill="url(#mc-cyber-plate)" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="120,14 139,32 132,50 108,50 101,32" fill="url(#mc-titanium)"/>

      <!-- Glowing Cyber Visor (Neon Horizontal Bar) -->
      <rect x="106" y="36" width="28" height="8" rx="2" fill="#022c22" stroke="#34d399" stroke-width="1.2"/>
      <rect x="108" y="38" width="24" height="4" rx="1" fill="url(#mc-neon-core)">
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="1.2s" repeatCount="indefinite"/>
      </rect>

      <!-- Scanning HUD Crosshair -->
      <g transform="translate(120, 20)">
        <circle cx="0" cy="0" r="8" stroke="#34d399" stroke-width="1.2" fill="none"/>
        <line x1="-11" y1="0" x2="11" y2="0" stroke="#ffffff" stroke-width="1.2"/>
        <line x1="0" y1="-11" x2="0" y2="11" stroke="#ffffff" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="2.5" fill="#6ee7b7">
          <animate attributeName="r" values="2; 3.2; 2" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Twin Micro Antenna Probes -->
      <line x1="96" y1="32" x2="86" y2="14" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
      <line x1="144" y1="32" x2="154" y2="14" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
      <circle cx="86" cy="14" r="2" fill="#ffffff"/>
      <circle cx="154" cy="14" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
