<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- 24K Liquid Dragon Gold -->
    <linearGradient id="ff-gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="ff-dark-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>

    <!-- Glowing Dragon Fire & Ruby -->
    <radialGradient id="ff-dragon-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <radialGradient id="ff-flame-sun" cx="50%" cy="50%" r="50%">
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="ff-dragon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <mask id="avatar-hole-ff-dragon">
      <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>
      <circle cx="120" cy="120" r="45" fill="#000000"/>
    </mask>
  </defs>

  <!-- MASTER CONTAINER: Centered with 20px padding from all edges to avoid any square clipping -->
  <g transform="translate(120, 120) scale(0.85) translate(-120, -114)">
    <!-- 1. ROTATING DRAGON SUNBURST & FIRE PARTICLES -->
    <g mask="url(#avatar-hole-ff-dragon)">
      <g transform="translate(120, 120)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="74" fill="url(#ff-flame-sun)"/>
        <!-- Sunburst fire spikes -->
        <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
          <line x1="0" y1="-76" x2="0" y2="-62"/>
          <line x1="53" y1="-53" x2="43" y2="-43"/>
          <line x1="76" y1="0" x2="62" y2="0"/>
          <line x1="53" y1="53" x2="43" y2="43"/>
          <line x1="0" y1="76" x2="0" y2="62"/>
          <line x1="-53" y1="53" x2="-43" y2="43"/>
          <line x1="-76" y1="0" x2="-62" y2="0"/>
          <line x1="-53" y1="-53" x2="-43" y2="-43"/>
        </g>
      </g>
    </g>

    <!-- 2. HEAVY ARMORED DRAGON WINGS (AGGRESSIVE SPIKES) -->
    <g filter="url(#ff-dragon-glow)">
      <!-- Left Armored Dragon Wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 120 120; -2 120 120; 0 120 120" dur="3.2s" repeatCount="indefinite" ease="ease-in-out"/>
        <!-- Outer Main Horn Blade -->
        <path d="M68 116 C48 94 20 62 10 24 C24 38 42 56 56 68 C32 46 18 26 12 6 C32 24 54 48 64 74 C44 42 36 20 34 2 C54 26 72 56 80 88 Z" fill="url(#ff-gold-metal)"/>
        <!-- Inner Wing Bone Plates -->
        <path d="M64 126 L26 84 L46 94 L62 112 Z" fill="url(#ff-dark-gold)"/>
        <path d="M66 138 L38 108 L54 116 L66 130 Z" fill="url(#ff-gold-metal)"/>
        <!-- Sharp Armor Spikes on Edge -->
        <polygon points="12,7 20,24 14,26" fill="#fef08a"/>
        <polygon points="10,25 22,42 16,44" fill="#fef08a"/>
        <!-- Glowing Wing Rune -->
        <path d="M16 28 C26 40 40 56 54 70" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- Right Armored Dragon Wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 120 120; 2 120 120; 0 120 120" dur="3.2s" repeatCount="indefinite" ease="ease-in-out"/>
        <!-- Outer Main Horn Blade -->
        <path d="M172 116 C192 94 220 62 230 24 C216 38 198 56 184 68 C208 46 222 26 228 6 C208 24 186 48 176 74 C196 42 204 20 206 2 C186 26 168 56 160 88 Z" fill="url(#ff-gold-metal)"/>
        <!-- Inner Wing Bone Plates -->
        <path d="M176 126 L214 84 L194 94 L178 112 Z" fill="url(#ff-dark-gold)"/>
        <path d="M174 138 L202 108 L186 116 L174 130 Z" fill="url(#ff-gold-metal)"/>
        <!-- Sharp Armor Spikes on Edge -->
        <polygon points="228,7 220,24 226,26" fill="#fef08a"/>
        <polygon points="230,25 218,42 224,44" fill="#fef08a"/>
        <!-- Glowing Wing Rune -->
        <path d="M224 28 C214 40 200 56 186 70" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      </g>
    </g>

    <!-- 3. DRAGON TALONS / CLAWS GRIPPING AVATAR (9h & 3h) -->
    <g filter="url(#ff-dragon-glow)">
      <!-- Left Dragon Talons -->
      <path d="M72 106 L58 102 L64 112 L70 110 Z" fill="url(#ff-gold-metal)"/>
      <path d="M70 120 L54 120 L62 126 L70 124 Z" fill="url(#ff-dark-gold)"/>
      <path d="M72 134 L58 138 L64 130 L70 132 Z" fill="url(#ff-gold-metal)"/>
      <!-- Claw Tips -->
      <polygon points="58,102 52,100 56,108" fill="#ffffff"/>
      <polygon points="54,120 48,120 52,125" fill="#ffffff"/>
      <polygon points="58,138 52,140 56,133" fill="#ffffff"/>

      <!-- Right Dragon Talons -->
      <path d="M168 106 L182 102 L176 112 L170 110 Z" fill="url(#ff-gold-metal)"/>
      <path d="M170 120 L186 120 L178 126 L170 124 Z" fill="url(#ff-dark-gold)"/>
      <path d="M168 134 L182 138 L176 130 L170 132 Z" fill="url(#ff-gold-metal)"/>
      <!-- Claw Tips -->
      <polygon points="182,102 188,100 184,108" fill="#ffffff"/>
      <polygon points="186,120 192,120 188,125" fill="#ffffff"/>
      <polygon points="182,138 188,140 184,133" fill="#ffffff"/>
    </g>

    <!-- 4. HEAVY GOLDEN RING WITH DRAGON SCALE ENGRAVINGS -->
    <g filter="url(#ff-dragon-glow)">
      <circle cx="120" cy="120" r="56.5" stroke="url(#ff-gold-metal)" stroke-width="6.5"/>
      <circle cx="120" cy="120" r="51.5" stroke="url(#ff-dark-gold)" stroke-width="2"/>
      <circle cx="120" cy="120" r="60.5" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 5. COILING DRAGON TAILS BASE (COMPACT & SLEEK) -->
    <g filter="url(#ff-dragon-glow)">
      <path d="M96 177 Q120 186 144 177 Q120 182 96 177 Z" fill="url(#ff-gold-metal)"/>
      <circle cx="120" cy="181" r="3" fill="url(#ff-dragon-eye)" stroke="#fef08a" stroke-width="0.8"/>
    </g>

    <!-- 6. TOP APEX: GIGANTIC THÁCH ĐẤU DRAGON HORNS & FIERCE DRAGON SKULL -->
    <g filter="url(#ff-dragon-glow)">
      <!-- Massive Sweeping Left Horn (Extends high up) -->
      <path d="M106 56 C98 34 82 12 72 -4 C78 14 92 36 100 58 Z" fill="url(#ff-gold-metal)" stroke="#451a03" stroke-width="1.2"/>
      <path d="M104 56 C98 38 88 20 80 8 C84 20 94 38 100 56 Z" fill="#ffffff" opacity="0.4"/>
      <polygon points="72,-4 76,8 70,10" fill="#ffffff"/>

      <!-- Massive Sweeping Right Horn (Extends high up) -->
      <path d="M134 56 C142 34 158 12 168 -4 C162 14 148 36 140 58 Z" fill="url(#ff-gold-metal)" stroke="#451a03" stroke-width="1.2"/>
      <path d="M136 56 C142 38 152 20 160 8 C156 20 146 38 140 56 Z" fill="#ffffff" opacity="0.4"/>
      <polygon points="168,-4 164,8 170,10" fill="#ffffff"/>

      <!-- Secondary Inner Horns -->
      <path d="M112 50 L104 22 L116 46 Z" fill="url(#ff-dark-gold)"/>
      <path d="M128 50 L136 22 L124 46 Z" fill="url(#ff-dark-gold)"/>

      <!-- Fierce Dragon Skull / Crown Armor Plating -->
      <polygon points="120,24 134,44 128,62 112,62 106,44" fill="url(#ff-gold-metal)" stroke="#78350f" stroke-width="1.5"/>
      <polygon points="120,27 131,43 120,58 109,43" fill="url(#ff-dark-gold)"/>

      <!-- Glowing Dragon Heart Ruby Gem -->
      <circle cx="120" cy="45" r="8.5" fill="url(#ff-dragon-eye)" stroke="#fef08a" stroke-width="1.8">
        <animate attributeName="r" values="8; 9.4; 8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="117.5" cy="42" r="2.5" fill="#ffffff" opacity="0.95"/>

      <!-- Glowing Dragon Eyes -->
      <ellipse cx="112" cy="38" rx="2.5" ry="1.4" transform="rotate(-20 112 38)" fill="#fef08a">
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="128" cy="38" rx="2.5" ry="1.4" transform="rotate(20 128 38)" fill="#fef08a">
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- 7. FLOATING GOLD EMBERS -->
    <g transform="translate(68, 40)">
      <circle cx="0" cy="0" r="2" fill="#fef08a">
        <animate attributeName="cy" values="0; -14; -28" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1; 0.6; 0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(172, 40)">
      <circle cx="0" cy="0" r="2" fill="#fef08a">
        <animate attributeName="cy" values="0; -14; -28" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1; 0.6; 0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
