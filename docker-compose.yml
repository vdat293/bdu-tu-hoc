services:
  postgres:
    image: postgres:16-alpine
    container_name: bdu-tu-hoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - bdu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bdu-hub:
    # Room membership and broadcasts are in this Node process. Keep exactly
    # one replica until a shared pub/sub adapter is introduced.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
    container_name: bdu-tu-hoc-app
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Production BẮT BUỘC có biến này cho baseline/migrate (migrate-baseline.js
      # từ chối chạy nếu thiếu). Trỏ cùng database, qua biến riêng để không lẫn
      # với runtime của app. Để trống ở dev/local cũng được.
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL:-}
      - DATABASE_SSL=false
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - SYSTEM_OWNER_MSSV=${SYSTEM_OWNER_MSSV:-}
      - ADMIN_DASHBOARD_KEY=${ADMIN_DASHBOARD_KEY:-}
      - AVATAR_MAX_SIZE_MB=${AVATAR_MAX_SIZE_MB:-3}
      # Cloudflare R2: ảnh người dùng không lưu trên máy chủ.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-}
      - R2_MEDIA_PROXY_PATH=${R2_MEDIA_PROXY_PATH:-/media/r2}
      - MEDIA_IMAGE_MAX_MB=${MEDIA_IMAGE_MAX_MB:-8}
      - MEDIA_GIF_MAX_MB=${MEDIA_GIF_MAX_MB:-8}
      - MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR=${MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR:-60}
      - MEDIA_POST_DELETE_RETENTION_DAYS=${MEDIA_POST_DELETE_RETENTION_DAYS:-7}
      - MEDIA_CLEANUP_INTERVAL_MINUTES=${MEDIA_CLEANUP_INTERVAL_MINUTES:-60}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
      - WS_TRUST_PROXY=${WS_TRUST_PROXY:-true}
      - WS_AUTH_TIMEOUT_MS=${WS_AUTH_TIMEOUT_MS:-30000}
      - WS_MAX_BUFFERED_BYTES=${WS_MAX_BUFFERED_BYTES:-524288}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - BDU_PROFILE_TIMEOUT_MS=${BDU_PROFILE_TIMEOUT_MS:-20000}
      - BDU_RESTORED_TOKEN_TTL_MS=${BDU_RESTORED_TOKEN_TTL_MS:-300000}
      - CDS_BASE_URL=${CDS_BASE_URL:-https://cds.bdu.edu.vn/data}
      - CDS_USER=${CDS_USER:-}
      - CDS_PASSWORD=${CDS_PASSWORD:-}
      - CDS_INSECURE_TLS=${CDS_INSECURE_TLS:-false}
      - ODP_SYNC_TIMEOUT_MS=${ODP_SYNC_TIMEOUT_MS:-180000}
      - ODP_SYNC_MAX_ROWS=${ODP_SYNC_MAX_ROWS:-600000}
      - RANKING_SYNC_ENABLED=${RANKING_SYNC_ENABLED:-true}
      - RANKING_SYNC_HOUR=${RANKING_SYNC_HOUR:-3}
      - RANKING_MIN_STUDENT_COUNT=${RANKING_MIN_STUDENT_COUNT:-100}
      - RANKING_SNAPSHOT_RETENTION_RUNS=${RANKING_SNAPSHOT_RETENTION_RUNS:-3}
      - RANKING_LATEST_COHORT=${RANKING_LATEST_COHORT:-}
      - NOTIFICATION_ENCRYPTION_KEY=${NOTIFICATION_ENCRYPTION_KEY:-}
      - APP_URL=${APP_URL:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      - DISCORD_INVITE_URL=${DISCORD_INVITE_URL:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - FB_IMPORT_ENABLED=${FB_IMPORT_ENABLED:-false}
      - FB_IMPORT_GROUP_URL=${FB_IMPORT_GROUP_URL:-https://www.facebook.com/groups/bdu.confessions}
      - FB_IMPORT_INTERVAL_MINUTES=${FB_IMPORT_INTERVAL_MINUTES:-20}
      - FB_IMPORT_MAX_SCROLLS=${FB_IMPORT_MAX_SCROLLS:-4}
      - FB_IMPORT_MAX_POSTS_PER_RUN=${FB_IMPORT_MAX_POSTS_PER_RUN:-10}
      - FB_IMPORT_PROFILE_DIR=/app/data/fb-profile
      - FB_IMPORT_MEDIA_DIR=/app/data/fb-import
      - FB_IMPORT_BROWSER_CHANNEL=${FB_IMPORT_BROWSER_CHANNEL:-}
      - FB_IMPORT_EXECUTABLE_PATH=${FB_IMPORT_EXECUTABLE_PATH:-}
      - FB_IMPORT_HEADLESS=${FB_IMPORT_HEADLESS:-true}
      - FB_IMPORT_HASH_SALT=${FB_IMPORT_HASH_SALT:-}
      - FB_IMPORT_USERNAME=${FB_IMPORT_USERNAME:-}
      - FB_IMPORT_PASSWORD=${FB_IMPORT_PASSWORD:-}
      - FB_IMPORT_AUTO_RELOGIN=${FB_IMPORT_AUTO_RELOGIN:-true}
      - FB_IMPORT_RELOGIN_MAX_ATTEMPTS=${FB_IMPORT_RELOGIN_MAX_ATTEMPTS:-2}
      - FB_IMPORT_RELOGIN_COOLDOWN_MINUTES=${FB_IMPORT_RELOGIN_COOLDOWN_MINUTES:-360}
      # Giữ chunk cũ của các bản build trước để HTML còn cache không 404.
      - CLIENT_ASSET_HISTORY_DIR=/app/data/client-assets
      - CLIENT_ASSET_HISTORY_DAYS=${CLIENT_ASSET_HISTORY_DAYS:-30}
      # Maintenance DB (backup/restore) chạy bằng `docker compose run --rm bdu-hub
      # npm run db:backup|db:restore`; các biến này phải nằm trong env của
      # service thì container mới thấy. Xem .env.example phần "Sao lưu DB".
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:-}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-}
      - BACKUP_CRON=${BACKUP_CRON:-}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-}
      - BACKUP_R2_BUCKET=${BACKUP_R2_BUCKET:-}
      # Bản dump local phải nằm trong volume được mount. Nếu không nó rơi vào
      # writable layer của container, và `docker compose run --rm` xoá sạch
      # container sau khi chạy xong => mất backup đúng lúc deploy cần nó nhất.
      - BACKUP_LOCAL_DIR=${BACKUP_LOCAL_DIR:-/app/data/backups}
      # Cờ chống ghi/xoá nhầm production; chỉ bật trên máy chủ production, không bật ở dev/test.
      - BDU_MAINTENANCE_ALLOW_PRODUCTION=${BDU_MAINTENANCE_ALLOW_PRODUCTION:-}
    depends_on:
      postgres:
        condition: service_healthy
    # KHÔNG chạy migration ở đây. `command` kiểu "migrate && start" khiến MỖI LẦN
    # restart container (kể cả do sự cố, do reboot, do restart của người vận
    # hành) đều chạy migration. Migration giờ chỉ chạy đúng 1 lần trong bước
    # deploy thủ công (backup → migrate), sau khi backup DB đã thành công.
    command: ["npm", "start"]
    # Cần thời gian để Node đóng server, ngắt WebSocket và drain các job đang
    # chạy. Docker mặc định chỉ cho 10s rồi SIGKILL -> client thấy socket đứt
    # cắt và phải reconnect.
    stop_grace_period: 40s
    # Image là Node + .NET, không có curl/wget -> dùng node -e để gọi
    # /api/health. start_period rộng vì app còn phải chạy scheduler (đồng bộ
    # xếp hạng, FB import) và mở WebSocket trước khi coi là healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./temp:/app/temp
      - ./data/fb-profile:/app/data/fb-profile
      - ./data/fb-import:/app/data/fb-import
      - ./data/client-assets:/app/data/client-assets
      # Backup DB chạy qua `docker compose run --rm bdu-hub` (bước 2 của
      # deploy.sh và db:backup:verify). Volume này là thứ giữ bản dump tồn tại
      # sau khi container tạm bị xoá. Phải khớp BACKUP_LOCAL_DIR ở trên.
      - ./data/backups:/app/data/backups

  # Bot Discord nhắc lịch/tag (chạy riêng process để crash không kéo sập web).
  # Cần DISCORD_BOT_TOKEN trong .env; để trống thì đừng start service này
  # (bot thoát ngay và restart-loop). Chỉ chạy bot ở MỘT nơi duy nhất
  # (prod HOẶC local) vì 1 token không online 2 chỗ cùng lúc được.
  bdu-notifier-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdu-tu-hoc-bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DATABASE_SSL=false
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/discord-bot.js"]

  # Backup DB định kỳ lên Cloudflare R2. Tách service riêng vì:
  # - chạy `pg_dump` nặng, không nên chiếm CPU của app;
  # - app restart không được làm mất lịch backup;
  # - bật/tắt độc lập (đặt BACKUP_ENABLED=1 trong .env mới chạy).
  # Restore drill (npm run db:backup:verify) chạy thủ công, cần DRILL_DATABASE_URL.
  bdu-db-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdu-tu-hoc-db-backup
    # KHÔNG dùng `unless-stopped`: scheduler `process.exit(0)` khi
    # BACKUP_ENABLED tắt, mà `unless-stopped` khởi động lại container dù exit
    # code là 0 => vòng lặp vô hạn. `on-failure:3` vẫn lấy lại container khi
    # scheduler crash thật, nhưng không hồi sinh container đã tắt chủ đồng.
    restart: on-failure:3
    environment:
      # Chỉ role backup chỉ đọc. KHÔNG dùng DATABASE_URL của app.
      - BACKUP_DATABASE_URL=${BACKUP_DATABASE_URL:-}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - BDU_MAINTENANCE_ALLOW_PRODUCTION=${BDU_MAINTENANCE_ALLOW_PRODUCTION:-}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-}
      - BACKUP_CRON=${BACKUP_CRON:-}
      - BACKUP_ALLOW_PRODUCTION=${BACKUP_ALLOW_PRODUCTION:-}
      # Bản dump local phải nằm trong volume được mount. Nếu không nó rơi vào
      # writable layer của container, và `docker compose run --rm` xoá sạch
      # container sau khi chạy xong => mất backup đúng lúc deploy cần nó nhất.
      - BACKUP_LOCAL_DIR=${BACKUP_LOCAL_DIR:-/app/data/backups}
      - BACKUP_ALERT_AFTER=${BACKUP_ALERT_AFTER:-}
      - BACKUP_ALERT_FILE=${BACKUP_ALERT_FILE:-}
      - BACKUP_ROTATE_MAX_DELETE=${BACKUP_ROTATE_MAX_DELETE:-}
      - DRILL_DATABASE_URL=${DRILL_DATABASE_URL:-}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-}
      - BACKUP_RETENTION_MONTHLY=${BACKUP_RETENTION_MONTHLY:-}
      - BACKUP_R2_BUCKET=${BACKUP_R2_BUCKET:-}
      # Cần R2_BUCKET để script so BACKUP_R2_BUCKET với bucket media và từ chối
      # nếu trùng. Thiếu biến này thì phép so sánh bị bỏ qua im lặng và dump
      # production có thể rơi vào bucket media.
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
    volumes:
      # Bản local tồn tại cho tới khi R2 verify xong; cần volume để restart
      # không làm mất bản đang dump dở.
      - ./data/backups:/app/data/backups
    # Scheduler tự tính giờ tới lần chạy kế tiếp rồi setTimeout; tự thoát nếu
    # BACKUP_ENABLED không bật để không treo một container vô dụng.
    command: ["node", "scripts/db-backup-scheduler.js"]

volumes:
  bdu-postgres-data:
