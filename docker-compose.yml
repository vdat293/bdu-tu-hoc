services:
  postgres:
    image: postgres:16-alpine
    container_name: bdu-tu-hoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - bdu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bdu-hub:
    # Room membership and broadcasts are in this Node process. Keep exactly
    # one replica until a shared pub/sub adapter is introduced.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
    container_name: bdu-tu-hoc-app
    restart: unless-stopped
    deploy:
      replicas: 1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DATABASE_SSL=false
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - SYSTEM_OWNER_MSSV=${SYSTEM_OWNER_MSSV:-}
      - ADMIN_DASHBOARD_KEY=${ADMIN_DASHBOARD_KEY:-}
      - AVATAR_MAX_SIZE_MB=${AVATAR_MAX_SIZE_MB:-3}
      # Cloudflare R2: ảnh người dùng không lưu trên VPS.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-}
      - R2_MEDIA_PROXY_PATH=${R2_MEDIA_PROXY_PATH:-/media/r2}
      - MEDIA_IMAGE_MAX_MB=${MEDIA_IMAGE_MAX_MB:-8}
      - MEDIA_GIF_MAX_MB=${MEDIA_GIF_MAX_MB:-8}
      - MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR=${MEDIA_UPLOAD_RATE_LIMIT_PER_HOUR:-60}
      - MEDIA_POST_DELETE_RETENTION_DAYS=${MEDIA_POST_DELETE_RETENTION_DAYS:-7}
      - MEDIA_CLEANUP_INTERVAL_MINUTES=${MEDIA_CLEANUP_INTERVAL_MINUTES:-60}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
      - WS_TRUST_PROXY=${WS_TRUST_PROXY:-true}
      - WS_AUTH_TIMEOUT_MS=${WS_AUTH_TIMEOUT_MS:-30000}
      - WS_MAX_BUFFERED_BYTES=${WS_MAX_BUFFERED_BYTES:-524288}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - BDU_PROFILE_TIMEOUT_MS=${BDU_PROFILE_TIMEOUT_MS:-20000}
      - BDU_RESTORED_TOKEN_TTL_MS=${BDU_RESTORED_TOKEN_TTL_MS:-300000}
      - CDS_USER=${CDS_USER:-}
      - CDS_PASSWORD=${CDS_PASSWORD:-}
      - CDS_INSECURE_TLS=${CDS_INSECURE_TLS:-false}
      - RANKING_SYNC_ENABLED=${RANKING_SYNC_ENABLED:-true}
      - RANKING_SYNC_HOUR=${RANKING_SYNC_HOUR:-3}
      - RANKING_SYNC_TIMEOUT_MS=${RANKING_SYNC_TIMEOUT_MS:-180000}
      - RANKING_MIN_STUDENT_COUNT=${RANKING_MIN_STUDENT_COUNT:-100}
      - RANKING_LATEST_COHORT=${RANKING_LATEST_COHORT:-}
      - NOTIFICATION_ENCRYPTION_KEY=${NOTIFICATION_ENCRYPTION_KEY:-}
      - APP_URL=${APP_URL:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      - DISCORD_INVITE_URL=${DISCORD_INVITE_URL:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - FB_IMPORT_ENABLED=${FB_IMPORT_ENABLED:-false}
      - FB_IMPORT_GROUP_URL=${FB_IMPORT_GROUP_URL:-https://www.facebook.com/groups/bdu.confessions}
      - FB_IMPORT_INTERVAL_MINUTES=${FB_IMPORT_INTERVAL_MINUTES:-20}
      - FB_IMPORT_MAX_SCROLLS=${FB_IMPORT_MAX_SCROLLS:-4}
      - FB_IMPORT_MAX_POSTS_PER_RUN=${FB_IMPORT_MAX_POSTS_PER_RUN:-10}
      - FB_IMPORT_PROFILE_DIR=/app/data/fb-profile
      - FB_IMPORT_MEDIA_DIR=/app/data/fb-import
      - FB_IMPORT_BROWSER_CHANNEL=${FB_IMPORT_BROWSER_CHANNEL:-}
      - FB_IMPORT_EXECUTABLE_PATH=${FB_IMPORT_EXECUTABLE_PATH:-}
      - FB_IMPORT_HEADLESS=${FB_IMPORT_HEADLESS:-true}
      - FB_IMPORT_HASH_SALT=${FB_IMPORT_HASH_SALT:-}
      - FB_IMPORT_USERNAME=${FB_IMPORT_USERNAME:-}
      - FB_IMPORT_PASSWORD=${FB_IMPORT_PASSWORD:-}
      - FB_IMPORT_AUTO_RELOGIN=${FB_IMPORT_AUTO_RELOGIN:-true}
      - FB_IMPORT_RELOGIN_MAX_ATTEMPTS=${FB_IMPORT_RELOGIN_MAX_ATTEMPTS:-2}
      - FB_IMPORT_RELOGIN_COOLDOWN_MINUTES=${FB_IMPORT_RELOGIN_COOLDOWN_MINUTES:-360}
      # Giữ chunk cũ của các bản build trước để HTML còn cache không 404.
      - CLIENT_ASSET_HISTORY_DIR=/app/data/client-assets
      - CLIENT_ASSET_HISTORY_DAYS=${CLIENT_ASSET_HISTORY_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    volumes:
      - ./temp:/app/temp
      - ./data/fb-profile:/app/data/fb-profile
      - ./data/fb-import:/app/data/fb-import
      - ./data/client-assets:/app/data/client-assets

  # Bot Discord nhắc lịch/tag (chạy riêng process để crash không kéo sập web).
  # Cần DISCORD_BOT_TOKEN trong .env; để trống thì đừng start service này
  # (bot thoát ngay và restart-loop). Chỉ chạy bot ở MỘT nơi duy nhất
  # (prod HOẶC local) vì 1 token không online 2 chỗ cùng lúc được.
  bdu-notifier-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdu-tu-hoc-bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DATABASE_SSL=false
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/discord-bot.js"]

volumes:
  bdu-postgres-data:
