name: bdu-local-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bdu_test_local
      POSTGRES_USER: bdu_test
      POSTGRES_PASSWORD: bdu_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdu_test -d bdu_test_local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    profiles: ["r2"]
    command: server /data
    environment:
      MINIO_ROOT_USER: bdu_test
      MINIO_ROOT_PASSWORD: bdu_test_password
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data
