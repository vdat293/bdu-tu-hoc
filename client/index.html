<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>BDU Tự Học - Cổng Tiện Ích & Tự Động Hóa Sinh Viên Đại Học Bình Dương</title>
  <meta name="description"
    content="Nền tảng tự học, tra cứu bảng điểm, xem lý lịch, thời khóa biểu, chuẩn hóa Word chuẩn viện và tự động hóa khảo sát dành riêng cho sinh viên BDU." />
  <link rel="icon" type="image/png" href="/assets/images/logo-hao-quang-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/showcase.css" />
</head>

<body class="theme-light">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bdu_theme') === 'dark' ? 'dark' : 'light';
        var path = window.location && window.location.pathname ? window.location.pathname : '';
        var s = /^\/login(?:\/|$)/.test(path)
          ? 'neumorphism'
          : (localStorage.getItem('bdu_ui_style') === 'claymorphism' ? 'claymorphism' : 'brutalism');
        var v = localStorage.getItem('bdu_vfx_enabled') === 'false' ? 'off' : 'on';
        var r = document.documentElement;
        r.dataset.theme = t;
        r.dataset.uiStyle = s;
        r.dataset.vfx = v;
        r.style.colorScheme = t;
        document.body.classList.toggle('theme-dark', t === 'dark');
        document.body.classList.toggle('theme-light', t !== 'dark');
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) {
          var bg = s === 'neumorphism'
            ? (t === 'dark' ? '#141923' : '#e8eef5')
            : (s === 'claymorphism'
              ? (t === 'dark' ? '#131b30' : '#edf2ff')
              : (t === 'dark' ? '#111318' : '#fffdf5'));
          tc.setAttribute('content', bg);
        }
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
