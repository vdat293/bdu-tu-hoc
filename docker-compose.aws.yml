# =============================================================================
# Override CHỈ dùng trên EC2 (production AWS).
#
# Bật bằng cách đặt trong `.env` trên server:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.aws.yml
# Khi đó mọi lệnh `docker compose ...` tự ghép hai file, nên `deploy/deploy.sh`
# không cần biết file này tồn tại.
#
# Vì sao cần file riêng:
#   - Image được build ở GitHub Actions và đẩy lên GHCR; EC2 chỉ KÉO về chạy.
#     Máy t3a.small (2 GB RAM) không đủ để build image có Chromium + .NET
#     (sẽ OOM), nên mọi lệnh `docker compose up` trên EC2 phải kèm `--no-build`.
#   - `caddy` là điểm vào duy nhất: TLS bằng Cloudflare Origin Certificate rồi
#     reverse_proxy toàn bộ (static + API + WebSocket) về `bdu-hub:3000`.
# =============================================================================

services:
  # Ba service dùng CHUNG một image của ứng dụng, chỉ khác `command` khai ở
  # docker-compose.yml gốc. `pull_policy: always` để Compose luôn lấy image
  # khớp `IMAGE_TAG` thay vì tái dùng bản cũ đang nằm trên máy.
  #
  # `build: !reset null` XOÁ khối `build:` thừa hưởng từ docker-compose.yml.
  # Bắt buộc: `docker compose run` KHÔNG có cờ `--no-build`, nên nếu còn `build:`
  # thì khi tag không kéo được (image bị prune, mất mạng, tag gõ sai) Compose sẽ
  # TỰ BUILD ngay trên máy 2 GB -> OOM. Sau khi reset, trường hợp đó báo lỗi
  # "not found" rõ ràng thay vì âm thầm build.
  bdu-hub:
    image: ghcr.io/vdat293/bdu-tu-hoc:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    pull_policy: always
    build: !reset null

  bdu-notifier-bot:
    image: ghcr.io/vdat293/bdu-tu-hoc:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    pull_policy: always
    build: !reset null

  bdu-db-backup:
    image: ghcr.io/vdat293/bdu-tu-hoc:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    pull_policy: always
    build: !reset null

  caddy:
    image: caddy:2-alpine
    container_name: bdu-tu-hoc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ Cloudflare Origin (origin.pem + origin.key) đặt tại đây;
      # thư mục này bị .gitignore, không bao giờ commit.
      - ./deploy/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bdu-hub

volumes:
  caddy_data:
  caddy_config:
